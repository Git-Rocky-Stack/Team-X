<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Development policy only: the Vite dev server needs eval, inline module
      preambles and a local HMR socket. Every `electron-vite build` swaps
      this tag for the strict production policy in ../../renderer-csp.ts,
      and scripts/check-packaged-csp.mjs verifies the built page.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws://localhost:* http://localhost:*;"
    />
    <title>Team-X</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
