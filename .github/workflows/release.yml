name: Release

# Triggered by pushing a version tag (e.g. v1.0.0).
# Builds installers for Windows, macOS, and Linux, generates SHA256
# checksums, and uploads everything to a GitHub Release draft.
on:
  push:
    tags:
      - 'v*'
  # Dry run from any branch: build, verify signatures, install-smoke every
  # platform, and upload the artifacts, without creating a release. Run it
  # before pushing a tag.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from root package.json `packageManager`
      # field (single source of truth). Pinned to pnpm@9.15.9.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Linux: Electron runtime libraries for headless build + keytar's
      # libsecret backing store. `pnpm test` loads keytar via
      # provider-factory.test.ts and would fail to dlopen `libsecret-1.so.0`
      # without `libsecret-1-0` installed. Mirrors the ci.yml `check` job's
      # libsecret install — keep both in sync.
      - name: Install Electron runtime libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            libgtk-3-0 \
            libsecret-1-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build workspace packages' dist outputs before typecheck.
      # apps/desktop's tsconfig declares each package as a composite project
      # reference, so its `tsc --noEmit` step expects the referenced project's
      # `dist/index.d.ts` to exist on disk. Fresh CI checkouts have no dist
      # (gitignored), so materialize them explicitly. `tsc --build` resolves
      # the reference graph and builds in dep order automatically. Mirrors
      # the ci.yml `check` job's pre-build step — keep both in sync.
      - name: Build workspace packages (composite refs)
        run: pnpm exec tsc --build packages/shared-types packages/role-schema packages/provider-router packages/telemetry-core packages/intelligence packages/local-gguf-runtime

      # Lint / Typecheck / Test as three separate steps so failures surface
      # individually. A previous attempt combined them into a single
      # multi-line `run:` block, which works under `bash -e` on Linux/macOS
      # but NOT under pwsh on Windows — pwsh does not abort on the first
      # failing command in a multi-line script, so a failed typecheck was
      # silently followed by a (passing) `pnpm test`, and the step's exit
      # code reflected only the last command. Three steps make every
      # failure mode visible.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Code signing (audit 2026-10-07 P0-4). Export only the credentials that
      # exist: an EMPTY CSC_LINK makes electron-builder read the project dir
      # as a certificate and fail. With nothing configured the build runs
      # unsigned, and "Verify code signatures" below fails the release unless
      # the TEAMX_ALLOW_UNSIGNED_RELEASE repository variable says otherwise.
      # Setup: docs/developer-guide/release-signing.md.
      - name: Configure code signing
        id: signing
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          set -euo pipefail
          export_if_set() { for name in "$@"; do if [ -n "${!name:-}" ]; then echo "${name}=${!name}" >> "$GITHUB_ENV"; fi; done; }
          mode=unsigned
          case "$PLATFORM" in
            mac)
              if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
                export_if_set CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
                mode=developer-id
                if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
                  echo "::error::Developer ID certificate present but notarization credentials are incomplete (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)."
                  exit 1
                fi
              else
                # No certificate: say so explicitly instead of letting
                # electron-builder probe the runner keychain.
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              fi
              ;;
            win)
              if [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
                for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE AZURE_SIGNING_PUBLISHER; do
                  if [ -z "${!v}" ]; then echo "::error::Azure Trusted Signing is configured but ${v} is empty."; exit 1; fi
                done
                export_if_set AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE AZURE_SIGNING_PUBLISHER
                mode=azure-trusted-signing
              elif [ -n "$WIN_CSC_LINK" ]; then
                export_if_set WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
                mode=authenticode-pfx
              fi
              ;;
            linux)
              # AppImage/deb carry no platform signature; integrity comes from
              # SHA256SUMS.txt and the build-provenance attestation.
              mode=not-applicable
              ;;
          esac
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Code signing for ${PLATFORM}: ${mode}"

      - name: Build + Package (${{ matrix.platform }})
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          args=(--"${PLATFORM}" --publish never)
          if [ "${PLATFORM}" = win ] && [ -n "${AZURE_SIGNING_ENDPOINT:-}" ]; then
            args+=(
              "-c.win.azureSignOptions.endpoint=${AZURE_SIGNING_ENDPOINT}"
              "-c.win.azureSignOptions.codeSigningAccountName=${AZURE_SIGNING_ACCOUNT}"
              "-c.win.azureSignOptions.certificateProfileName=${AZURE_SIGNING_PROFILE}"
              "-c.win.azureSignOptions.publisherName=${AZURE_SIGNING_PUBLISHER}"
            )
          fi
          pnpm -F @team-x/desktop build
          pnpm -F @team-x/desktop exec electron-builder "${args[@]}"

      # The renderer packed into this platform's installer must carry the
      # strict production CSP (audit 2026-10-07 P0-3).
      - name: Verify packaged renderer CSP
        run: node scripts/check-packaged-csp.mjs

      # Signature gate. A signed build must verify; an unsigned one fails the
      # release unless the TEAMX_ALLOW_UNSIGNED_RELEASE repository variable is
      # "true", in which case the release notes say so in bold (publish job).
      - name: Verify code signatures (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          ALLOW_UNSIGNED: ${{ vars.TEAMX_ALLOW_UNSIGNED_RELEASE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem release -Recurse -File -Include 'Team-X-*-Setup-*.exe', 'Team-X.exe' |
            Where-Object { $_.FullName -notmatch '\\(__uninstaller|resources)\\' })
          if ($files.Count -lt 2) { throw "Expected installers and unpacked Team-X.exe under release/, found $($files.Count) file(s)." }
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $f.FullName
            Write-Host ("{0,-12} {1}" -f $sig.Status, $f.FullName)
            if ($sig.Status -ne 'Valid') { $bad += $f.FullName }
          }
          if ($bad.Count -eq 0) { Write-Host "All $($files.Count) Windows executables carry a valid Authenticode signature."; exit 0 }
          if ($env:SIGNING_MODE -ne 'unsigned') { throw "Signing was configured ($env:SIGNING_MODE) but $($bad.Count) file(s) are not validly signed." }
          if ($env:ALLOW_UNSIGNED -eq 'true') {
            Write-Host "::warning::Shipping UNSIGNED Windows installers (TEAMX_ALLOW_UNSIGNED_RELEASE=true)."
            New-Item -ItemType Directory -Force -Path release/unsigned | Out-Null
            Set-Content -Path release/unsigned/win.txt -Value 'Windows installers are not Authenticode-signed.'
            exit 0
          }
          throw "Windows artifacts are unsigned. Configure signing (docs/developer-guide/release-signing.md) or set TEAMX_ALLOW_UNSIGNED_RELEASE=true to ship unsigned on purpose."

      - name: Verify code signatures (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          ALLOW_UNSIGNED: ${{ vars.TEAMX_ALLOW_UNSIGNED_RELEASE }}
        run: |
          set -uo pipefail
          apps="$(find release -maxdepth 3 -type d -name 'Team-X.app')"
          if [ -z "${apps}" ]; then echo "::error::No Team-X.app under release/."; exit 1; fi
          ok=true
          while IFS= read -r app; do
            echo "== ${app}"
            codesign --verify --deep --strict --verbose=2 "${app}" || ok=false
            spctl --assess --type execute --verbose=4 "${app}" || ok=false
            xcrun stapler validate "${app}" || ok=false
          done <<< "${apps}"
          if [ "${ok}" = true ]; then echo "Every Team-X.app is signed, notarized, stapled and Gatekeeper-accepted."; exit 0; fi
          if [ "${SIGNING_MODE}" != unsigned ]; then
            echo "::error::Signing was configured (${SIGNING_MODE}) but verification failed."
            exit 1
          fi
          if [ "${ALLOW_UNSIGNED}" = true ]; then
            echo "::warning::Shipping UNSIGNED macOS disk images (TEAMX_ALLOW_UNSIGNED_RELEASE=true)."
            mkdir -p release/unsigned && echo 'macOS disk images are not signed or notarized.' > release/unsigned/mac.txt
            exit 0
          fi
          echo "::error::macOS artifacts are unsigned. Configure signing (docs/developer-guide/release-signing.md) or set TEAMX_ALLOW_UNSIGNED_RELEASE=true to ship unsigned on purpose."
          exit 1

      # Clean-host install smoke: install the real installer the way a user
      # would, launch the installed app, then uninstall and prove it is gone.
      - name: Install, launch, uninstall (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release -Recurse -File -Filter 'Team-X-*-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No x64 installer under release/.' }
          Write-Host "Installing $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -File -Filter 'Team-X.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Installer finished but Team-X.exe is not under %LOCALAPPDATA%\Programs.' }
          $dir = $exe.DirectoryName
          $uninstaller = Get-ChildItem $dir -File -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "No uninstaller next to $($exe.FullName)." }
          if ($env:SIGNING_MODE -ne 'unsigned') {
            foreach ($f in @($exe.FullName, $uninstaller.FullName)) {
              $st = (Get-AuthenticodeSignature -FilePath $f).Status
              if ($st -ne 'Valid') { throw "Installed $f is not validly signed ($st)." }
            }
          }
          $data = Join-Path $env:RUNNER_TEMP 'teamx-smoke-profile'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--user-data-dir=$data" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "Installed Team-X exited during startup (code $($p.ExitCode))." }
          Write-Host 'Installed app stayed up 25s.'
          Stop-Process -Id $p.Id -Force
          Get-Process -Name 'Team-X' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe.FullName); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe.FullName) { throw "Uninstall left $($exe.FullName) behind." }
          Write-Host 'Install, launch and uninstall all succeeded.'

      - name: Install, launch, uninstall (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"; [ "${arch}" = x86_64 ] && arch=x64
          dmg="$(find release -maxdepth 2 -type f -name "Team-X-*-${arch}.dmg" | head -n1)"
          if [ -z "${dmg}" ]; then echo "::error::No ${arch} DMG under release/."; exit 1; fi
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mnt}" "${dmg}"
          dest="${RUNNER_TEMP}/Applications"
          mkdir -p "${dest}"
          cp -R "${mnt}/Team-X.app" "${dest}/"
          hdiutil detach "${mnt}"
          app="${dest}/Team-X.app"
          "${app}/Contents/MacOS/Team-X" --user-data-dir="${RUNNER_TEMP}/teamx-smoke-profile" &
          pid=$!
          sleep 25
          if ! kill -0 "${pid}" 2>/dev/null; then
            code=0; wait "${pid}" || code=$?
            echo "::error::Installed Team-X exited during startup (code ${code})."; exit 1
          fi
          echo "Installed app stayed up 25s."
          kill "${pid}"; wait "${pid}" 2>/dev/null || true
          rm -rf "${app}"
          if [ -e "${app}" ]; then echo "::error::Uninstall (removing the bundle) failed."; exit 1; fi
          echo "Install, launch and uninstall all succeeded."

      # Smoke-test the Linux AppImage before it can ship. The image embeds the
      # static type2-runtime (electron-builder.yml `toolsets.appimage`), so it
      # must start on a stock Ubuntu desktop with NO FUSE 2 library installed
      # (issues #4, #16). The runner mirrors that host: FUSE 2 is removed,
      # fuse3 (which stock Ubuntu desktops ship) provides `fusermount3`. We
      # assert the runtime is static, prove the image self-mounts, then boot it
      # headlessly under Xvfb and require it to survive a short startup window.
      - name: Smoke-test AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb fuse3
          # Match a stock desktop: no FUSE 2 library anywhere on the host.
          sudo apt-get remove -y libfuse2t64 libfuse2 2>/dev/null || true
          if ldconfig -p | grep -q 'libfuse\.so\.2'; then
            echo "::error::FUSE 2 (libfuse.so.2) is still present; the no-FUSE-2 check would prove nothing."
            exit 1
          fi

          # electron-builder expands ${arch} to AppImage-convention `x86_64`
          # (not `x64`) for this target — the lookup must stay arch-agnostic,
          # matching the upload/publish globs. find + `|| true` keeps a
          # no-match from tripping the runner's default `bash -e` before the
          # guard below can report it (a bare `ls` glob exits 2 and killed
          # the step silently on the first v3.4.0 run).
          APPIMAGE="$(find release -maxdepth 2 -type f -name 'Team-X-*.AppImage' 2>/dev/null | head -n1 || true)"
          if [ -z "${APPIMAGE}" ]; then
            echo "::error::No AppImage found under release/*/ — packaging produced none."
            ls -R release/ 2>/dev/null || true
            exit 1
          fi
          chmod +x "${APPIMAGE}"
          echo "Smoke-testing: ${APPIMAGE}"

          # 0) The embedded runtime must be the static one: the legacy runtime
          #    is dynamically linked and dlopen()s libfuse.so.2.
          if ! file "${APPIMAGE}" | grep -q 'static'; then
            echo "::error::AppImage runtime is not statically linked — toolsets.appimage regressed."
            file "${APPIMAGE}"
            exit 1
          fi

          # 1) Deterministic FUSE/runtime check: the image must self-mount.
          #    A broken FUSE path or corrupt squashfs exits non-zero here.
          "${APPIMAGE}" --appimage-mount >/tmp/aimount.log 2>&1 &
          MNT_PID=$!
          sleep 3
          if ! kill -0 "${MNT_PID}" 2>/dev/null; then
            wait "${MNT_PID}" || true
            echo "::error::AppImage failed to self-mount (FUSE/runtime broken)."
            cat /tmp/aimount.log 2>/dev/null || true
            exit 1
          fi
          MNT="$(head -n1 /tmp/aimount.log 2>/dev/null || true)"
          echo "Self-mounted OK at: ${MNT:-<unknown>}"
          if [ -n "${MNT}" ] && [ -e "${MNT}/AppRun" ]; then echo "AppRun present in mount."; fi
          kill "${MNT_PID}" 2>/dev/null || true
          wait "${MNT_PID}" 2>/dev/null || true

          # 2) Functional boot check: launch headless and require it to stay up.
          #    --no-sandbox is needed on CI runners (no SUID sandbox / restricted
          #    user namespaces); it affects only this boot check, not artifacts.
          xvfb-run -a "${APPIMAGE}" --no-sandbox >/tmp/aiboot.log 2>&1 &
          APP_PID=$!
          for _ in $(seq 1 25); do
            if ! kill -0 "${APP_PID}" 2>/dev/null; then
              wait "${APP_PID}"; code=$?
              echo "::error::AppImage exited early (code ${code}) — failed to start."
              echo "----- boot log -----"; cat /tmp/aiboot.log 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          echo "AppImage booted and stayed alive 25s — smoke test passed."
          kill "${APP_PID}" 2>/dev/null || true
          wait "${APP_PID}" 2>/dev/null || true

      # Upload installers + electron-updater manifests + diff-update block
      # maps. Whitelist by artifact-name pattern so the win-unpacked binary
      # (`win-unpacked/Team-X.exe`, ~181 MB) does NOT get bundled — the v3.2.0
      # ship used `release/**/*.exe` which dragged it in and surfaced as a
      # stray `Team-X.exe` asset on the release. See
      # docs/handoffs/2026-05-12-v3.2.0-release-shipped.md §4.3 for context.
      #
      # SHA256SUMS.txt is intentionally NOT generated here — it's produced
      # once in the publish job below, AFTER download-artifact merges all
      # three OS bundles. Per-OS generation in v3.2.0 was clobbered by
      # `merge-multiple: true`, which last-write-wins on same-named files.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/**/Team-X-*-Setup-*.exe
            release/**/Team-X-*.dmg
            release/**/Team-X-*.AppImage
            release/**/Team-X-*.deb
            release/**/Team-X-*-Setup-*.exe.blockmap
            release/**/Team-X-*.dmg.blockmap
            release/**/latest*.yml
            release/unsigned/*.txt
          retention-days: 7

  publish:
    name: Create GitHub Release
    needs: build
    # Only a version tag publishes; a workflow_dispatch dry run stops at build.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Build-provenance attestations (Sigstore-backed, verifiable with
    # `gh attestation verify`) need an OIDC token and attestation write.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Generate the SHA256SUMS manifest AFTER merge so it covers every
      # installer across all three OSes in one consolidated file. v3.2.0
      # generated this per-OS in each build job, but `merge-multiple: true`
      # then flattened the three bundles into one dir — last-write-wins on
      # `SHA256SUMS.txt` meant only one OS's hashes survived. Generating
      # here, post-merge, eliminates the collision structurally. See
      # docs/handoffs/2026-05-12-v3.2.0-release-shipped.md §4.3.
      - name: Generate consolidated SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # electron-builder writes to release/<version>/ on the build runner,
          # but upload-artifact@v4 strips the common path prefix (`release/`)
          # from every uploaded path. After merge-multiple, files land at
          # artifacts/<version>/, NOT artifacts/release/<version>/. Glob the
          # version dir so the version itself isn't hardcoded.
          # `unsigned/` (signature-gate markers) sits beside the version dir.
          dirs=(artifacts/[0-9]*/)
          if [ ${#dirs[@]} -ne 1 ]; then
            echo "Expected exactly one version dir under artifacts/, found: ${dirs[*]}"
            ls -la artifacts/ || true
            exit 1
          fi
          cd "${dirs[0]}"

          rm -f SHA256SUMS.txt
          # Hash installers only — blockmaps and update manifests ship
          # alongside as separate assets but aren't covered by the
          # integrity manifest (electron-updater verifies them separately).
          for f in Team-X-*-Setup-*.exe Team-X-*.dmg Team-X-*.AppImage Team-X-*.deb; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            fi
          done

          sort -k 2 SHA256SUMS.txt -o SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      # Provenance for every installer, plus an SBOM of the shipped dependency
      # graph attached to the release (audit 2026-10-07 exit criteria).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/**/Team-X-*-Setup-*.exe
            artifacts/**/Team-X-*.dmg
            artifacts/**/Team-X-*.AppImage
            artifacts/**/Team-X-*.deb

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/Team-X-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Hand-written notes for this tag, when they exist, lead the release
      # body; GitHub's generated PR list is appended below them. A tag with
      # no notes file keeps the generated list alone. If the signature gate
      # let an unsigned platform through (TEAMX_ALLOW_UNSIGNED_RELEASE), the
      # body opens with a warning naming it.
      - name: Pick release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          body="${RUNNER_TEMP}/release-body.md"
          : > "${body}"
          if compgen -G 'artifacts/unsigned/*.txt' > /dev/null; then
            {
              echo '> [!WARNING]'
              echo '> **Unsigned build.** This release was published without code signing on:'
              for m in artifacts/unsigned/*.txt; do echo "> - $(cat "$m")"; done
              # shellcheck disable=SC2016 # literal Markdown backticks
              echo '> Your operating system will warn before running it. Verify the download against `SHA256SUMS.txt` and the build-provenance attestation (`gh attestation verify <file> --repo '"${GITHUB_REPOSITORY}"'`).'
              echo
            } >> "${body}"
          fi
          if [ -f "$f" ]; then cat "$f" >> "${body}"; else echo "No $f — using generated notes only."; fi
          if [ -s "${body}" ]; then echo "path=${body}" >> "$GITHUB_OUTPUT"; fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          # Whitelist installer names — prevents stray `win-unpacked/Team-X.exe`
          # from appearing as an asset. `latest*.yml` + `*.blockmap` are now
          # uploaded for electron-updater auto-update and differential downloads.
          files: |
            artifacts/**/Team-X-*-Setup-*.exe
            artifacts/**/Team-X-*.dmg
            artifacts/**/Team-X-*.AppImage
            artifacts/**/Team-X-*.deb
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
            artifacts/**/SHA256SUMS.txt
            artifacts/Team-X-*-sbom.spdx.json
        env:
